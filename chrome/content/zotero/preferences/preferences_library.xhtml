<vbox id="zotero-prefpane-library"
	onload="Zotero_Preferences.Library.init()"
	onunload="Zotero_Preferences.Library.uninit()"
>
	<vbox class="main-section">
		<groupbox aria-label="Current library">
			<label><html:h2>Current library</html:h2></label>
			<description id="library-current-path" class="library-path"/>
			<description id="library-current-status" class="library-muted"/>
			<hbox class="library-button-row">
				<button id="library-open" label="Open folder" oncommand="Zotero_Preferences.Library.openLibrary()"/>
				<button id="library-move" label="Move…" oncommand="Zotero_Preferences.Library.moveLibrary()"/>
			</hbox>
			<checkbox id="library-replace-confirm"
				label="I understand that replacing removes the current library from the active view"
				hidden="true"
				oncommand="Zotero_Preferences.Library.updateButtons()"/>
			<button id="library-replace"
				label="Replace with the selected Zotero library…"
				hidden="true"
				disabled="true"
				oncommand="Zotero_Preferences.Library.replaceSelected()"/>
			<description class="library-muted">
				CiteWell is independent of Zotero: it has its own library and profile, and it never
				writes to Zotero's data directory.
			</description>
		</groupbox>

		<groupbox aria-label="Locations">
			<label><html:h2>Locations</html:h2></label>
			<description class="library-muted">
				Where each piece of the current library lives.
			</description>
			<vbox id="library-locations" class="library-locations"/>
		</groupbox>



		<groupbox id="zotero-prefpane-file-handling-groupbox" aria-label="&zotero.preferences.fileHandling;">
			<label><html:h2>&zotero.preferences.fileHandling;</html:h2></label>

			<vbox>
				<checkbox label="&zotero.preferences.downloadAssociatedFiles;"
					preference="extensions.zotero.downloadAssociatedFiles"
					native="true"
				/>
				<checkbox data-l10n-id="preferences-auto-recognize-files"
					preference="extensions.zotero.autoRecognizeFiles"
					native="true"
				/>
				<checkbox id="automaticSnapshots-checkbox"
					label="&zotero.preferences.automaticSnapshots;"
					preference="extensions.zotero.automaticSnapshots"
					native="true"
				/>
			</vbox>

		</groupbox>

		<groupbox id="zotero-prefpane-file-renaming-groupbox" aria-labelledby="preferences-file-renaming-title" aria-describedby="preferences-file-renaming-intro">
			<label><html:h2 id="preferences-file-renaming-title" data-l10n-id="preferences-file-renaming-title"/></label>

			<vbox align="start">
				<label id="preferences-file-renaming-intro" data-l10n-id="preferences-file-renaming-intro"/>
				<separator class="thin"/>
				<button id="file-renaming-configure-button"
					data-l10n-id="preferences-file-renaming-configure-button"
					data-search-strings="file-renaming-format-title, file-renaming-format-template, file-renaming-auto-rename-files"
					oncommand="Zotero_Preferences.General.openFileRenamingDialog()"
				/>
			</vbox>
		</groupbox>

		<groupbox>
			<label><html:h2 data-l10n-id="preferences-attachment-titles-title"/></label>

			<description data-l10n-id="preferences-attachment-titles-intro">
				<label is="zotero-text-link" href="https://www.zotero.org/support/kb/attachment_title_vs_filename" data-l10n-name="wiki-link"/>
			</description>

			<checkbox
				data-l10n-id="preferences-attachment-titles-show-filenames"
				preference="extensions.zotero.showAttachmentFilenames"
				native="true"
			/>
		</groupbox>


		<groupbox aria-label="&zotero.preferences.attachmentBaseDir.caption;" aria-description="&zotero.preferences.attachmentBaseDir.message;">
			<label><html:h2>&zotero.preferences.attachmentBaseDir.caption;</html:h2></label>

			<vbox>
				<description>&zotero.preferences.attachmentBaseDir.message;</description>
			</vbox>

			<hbox align="center">
				<label id="baseAttachmentPathLabel" value="&zotero.preferences.attachmentBaseDir.basePath;"/>
				<html:input type="text" id="baseAttachmentPath"
					preference="extensions.zotero.baseAttachmentPath"
					readonly="true"
					flex="1"
					tabindex="0"
					class="directory-path"
					aria-labelledby="baseAttachmentPathLabel"/>
				<button id="baseAttachmentPathButton"
					label="&zotero.preferences.attachmentBaseDir.selectBasePath;"
					oncommand="Zotero_Preferences.Attachment_Base_Directory.choosePath()"
					aria-describedby="baseAttachmentPathLabel"/>
			</hbox>

			<hbox class="preferences-button-group">
				<button id="resetBasePath"
					label="&zotero.preferences.attachmentBaseDir.resetBasePath;"
					oncommand="Zotero_Preferences.Attachment_Base_Directory.clearPath()"
					data-search-strings="attachmentBasePath.clearBasePath.message"/>
			</hbox>

		</groupbox>

		<groupbox aria-label="&zotero.preferences.dataDir;">
			<label><html:h2>&zotero.preferences.dataDir;</html:h2></label>

			<hbox align="center">
				<label id="data-dir-label" data-l10n-id="preferences-advanced-data-dir" control="data-dir-path"></label>
				<html:input type="text" id="data-dir-path" preference="extensions.zotero.dataDir"
					readonly="true" class="directory-path"/>
				<button id="change-data-dir" label="&zotero.preferences.attachmentBaseDir.selectBasePath;"
					aria-describedby="data-dir-label"
					oncommand="Zotero_Preferences.Advanced.dataDirUpdate(true)"/>
			</hbox>

			<vbox id="command-line-data-dir" hidden="true">
				<description id="command-line-data-dir-path"/>
				<label value="&zotero.preferences.dataDir.viaCommandLine;"/>
			</vbox>

			<hbox class="preferences-button-group">
				<button label="&zotero.preferences.dataDir.reveal;"
					oncommand="Zotero.DataDirectory.reveal()"/>
				<button id="custom-data-dir" data-l10n-id="preferences-advanced-custom-data-dir"
					oncommand="Zotero_Preferences.Advanced.dataDirUpdate(true)"/>
				<button id="reset-data-dir" data-l10n-id="preferences-advanced-reset-data-dir"
					oncommand="Zotero_Preferences.Advanced.dataDirUpdate(false)" aria-describedby="default-data-dir"/>
				<html:input id="default-data-dir" data-l10n-id="preferences-advanced-default-data-dir"
					data-l10n-attrs="value" readonly="true" class="directory-path"/>
				<button id="migrate-data-dir" label="&zotero.preferences.dataDir.migrate;"
					oncommand="Zotero_Preferences.Advanced.migrateDataDirectory()" hidden="true"/>
			</hbox>
		</groupbox>


	</vbox>
</vbox>
