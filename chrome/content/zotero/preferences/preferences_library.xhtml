<vbox id="zotero-prefpane-library"
	onload="Zotero_Preferences.Library.init()"
	onunload="Zotero_Preferences.Library.uninit()"
>
	<vbox class="main-section">
		<groupbox aria-label="Current library">
			<label><html:h2>Current library</html:h2></label>
			<description id="library-current-path" class="library-path"/>
			<description id="library-current-status" class="library-muted"/>
			<hbox class="library-button-row">
				<button id="library-open" label="Open folder" oncommand="Zotero_Preferences.Library.openLibrary()"/>
				<button id="library-move" label="Move…" oncommand="Zotero_Preferences.Library.moveLibrary()"/>
			</hbox>
			<checkbox id="library-replace-confirm"
				label="I understand that replacing removes the current library from the active view"
				hidden="true"
				oncommand="Zotero_Preferences.Library.updateButtons()"/>
			<button id="library-replace"
				label="Replace with the selected Zotero library…"
				hidden="true"
				disabled="true"
				oncommand="Zotero_Preferences.Library.replaceSelected()"/>
			<description class="library-muted">
				CiteWell is independent of Zotero: it has its own library and profile, and it never
				writes to Zotero's data directory.
			</description>
		</groupbox>

		<groupbox aria-label="Locations">
			<label><html:h2>Locations</html:h2></label>
			<description class="library-muted">
				Where each piece of the current library lives.
			</description>
			<vbox id="library-locations" class="library-locations"/>
		</groupbox>



	</vbox>
</vbox>
