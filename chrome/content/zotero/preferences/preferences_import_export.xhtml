<vbox id="zotero-prefpane-import-export"
	onload="event.waitUntil(Zotero_Preferences.ImportExport.init())">
	<vbox class="main-section">
	<groupbox id="zotero-prefpane-export-groupbox" aria-label="&zotero.preferences.quickCopy.caption;" aria-describedby="quickCopy-instructions quickCopy-citationInstructions">
		<vbox>
			<label><html:h2>&zotero.preferences.quickCopy.caption;</html:h2></label>
		</vbox>

		<label id="quickCopy-instructions"/>
		<separator class="thin"/>
		<label id="quickCopy-citationInstructions"/>

		<separator/>

		<label value="&zotero.preferences.quickCopy.itemFormat;" control="zotero-quickCopy-menu"/>
		<menulist id="zotero-quickCopy-menu" label="&zotero.general.loading;" native="true"/>

		<hbox align="center">
			<label id="zotero-quickCopy-locale-menu-label" value="&zotero.bibliography.locale.label;" control="zotero-quickCopy-locale-menu"/>
			<menulist id="zotero-quickCopy-locale-menu" oncommand="Zotero_Preferences.Export._lastSelectedLocale = this.value" native="true"/>

			<separator orient="vertical" width="15px"/>

			<checkbox id="zotero-quickCopy-copyAsHTML" label="&zotero.preferences.quickCopy.copyAsHTML;"
				oncommand="Zotero_Preferences.Export.onCopyAsHTMLChange(this.checked)"
				native="true"/>
		</hbox>

		<separator/>

		<label value="&zotero.preferences.quickCopy.noteFormat;" control="zotero-noteQuickCopy-menu"/>
		<menulist id="zotero-noteQuickCopy-menu" label="&zotero.general.loading;" native="true"/>
		<box id="noteQuickCopy-wrapper">
			<vbox id="noteQuickCopy-format-options" hidden="true" align="center">
				<hbox id="noteQuickCopy-markdown-options" align="center">
					<label id="noteQuickCopy-markdown-includeAppLinks-label"></label>
					<checkbox id="noteQuickCopy-markdown-includeAppLinks"
						oncommand="Zotero_Preferences.Export.onUpdateNoteExportOptions()"
						native="true" aria-describedby="noteQuickCopy-markdown-includeAppLinks-label"/>
				</hbox>
				<hbox id="noteQuickCopy-html-options" align="center">
					<label id="noteQuickCopy-html-includeAppLinks-label"></label>
					<checkbox id="noteQuickCopy-html-includeAppLinks"
						oncommand="Zotero_Preferences.Export.onUpdateNoteExportOptions()"
						native="true" aria-describedby="noteQuickCopy-html-includeAppLinks-label"/>
				</hbox>
			</vbox>
		</box>
		<separator/>

		<label value="&zotero.preferences.quickCopy.siteEditor.setings;" control="quickCopy-siteSettings-table"/>
		<hbox class="virtualized-table-container" flex="1">
			<html:div id="quickCopy-siteSettings"/>
		</hbox>
		<separator class="thin"/>
		<hbox>
			<button disabled="true" id="quickCopy-edit" label="&zotero.general.edit;"
				onclick="if (!this.disabled) Zotero_Preferences.Export.showQuickCopySiteEditor(true)"/>
			<spacer flex="1"/>
			<button disabled="true" id="quickCopy-delete" data-l10n-id="preferences-quickCopy-minus" data-l10n-args='{"label":"-"}' onclick="if (!this.disabled) Zotero_Preferences.Export.deleteSelectedQuickCopySite()"/>
			<button data-l10n-id="preferences-quickCopy-plus" data-l10n-args='{"label":"+"}' id="quickCopy-add" onclick="Zotero_Preferences.Export.showQuickCopySiteEditor()"></button>
		</hbox>

		<hbox align="center">
			<label id="zotero-prefpane-quickcopy-draglimit-label1" value="&zotero.preferences.quickCopy.dragLimit;"/>
			<html:input aria-labelledby="zotero-prefpane-quickcopy-draglimit-label1 zotero-prefpane-quickcopy-draglimit-label2" type="text" preference="extensions.zotero.export.quickCopy.dragLimit" size="3"/>
			<label id="zotero-prefpane-quickcopy-draglimit-label2" value="&zotero.preferences.items;" flex="1"/>
		</hbox>
	</groupbox>
		<groupbox aria-label="Import from Zotero">
			<label><html:h2>Import from Zotero</html:h2></label>
			<description>
				Copies a Zotero library into CiteWell. Zotero is never modified, and its settings,
				plugins and sync credentials are never copied.
			</description>

			<radiogroup id="library-candidates" class="library-candidates"/>
			<description id="library-candidate-warning" class="library-warning" hidden="true"/>
			<description id="library-candidate-summary" class="library-muted"/>

			<hbox class="library-button-row">
				<button id="library-rescan" label="Rescan" oncommand="Zotero_Preferences.Library.rescan()"/>
				<button id="library-choose" label="Choose another folder…" oncommand="Zotero_Preferences.Library.chooseFolder()"/>
				<button id="library-check" label="Check" oncommand="Zotero_Preferences.Library.checkSelected()"/>
			</hbox>

			<progressmeter id="library-progress" mode="undetermined" hidden="true"/>
			<description id="library-import-status" class="library-status"/>

			<hbox class="library-button-row">
				<button id="library-import" label="Import…" oncommand="Zotero_Preferences.Library.importSelected()" disabled="true"/>
				<button id="library-cancel" label="Cancel staged import" oncommand="Zotero_Preferences.Library.cancelImport()" hidden="true"/>
				<button id="library-cancel-restore" label="Cancel staged restore" oncommand="Zotero_Preferences.Library.cancelRestore()" hidden="true"/>
			</hbox>
			<description class="library-muted">
				Merging into an existing library is the next phase. Today a non-empty library can be
				replaced, with a restore point kept.
			</description>
		</groupbox>

		<groupbox aria-label="Restore points">
			<label><html:h2>Restore points</html:h2></label>
			<description class="library-muted">
				Backups made by import, replace or restore. Restoring swaps the active library and keeps
				the current one as a new restore point.
			</description>
			<vbox id="library-restore-points"/>
			<hbox class="library-button-row">
				<button id="library-restore-open" label="Open backup folder" oncommand="Zotero_Preferences.Library.openBackups()"/>
			</hbox>
		</groupbox>

		<groupbox aria-label="Last import">
			<label><html:h2>Last import</html:h2></label>
			<description id="library-last-result" class="library-muted"/>
		</groupbox>
	</vbox>
</vbox>
