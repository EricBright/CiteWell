<vbox id="zotero-prefpane-agent"
	onload="Zotero_Preferences.Agent.init()"
	onunload="Zotero_Preferences.Agent.uninit()"
>
	<groupbox aria-label="Set up an agent">
			<label><html:h2>Set up an agent</html:h2></label>
			<description>
				The CLI is a thin client for this bridge. Install it from a CiteWell source checkout,
				then point it at this data directory:
			</description>
			<html:textarea id="agent-setup" readonly="true" class="agent-snippet"/>
			<hbox>
				<button id="agent-setup-copy" label="Copy setup" oncommand="Zotero_Preferences.Agent.copySetup()"/>
				<button id="agent-audit-open" label="Open audit log" oncommand="Zotero_Preferences.Agent.openAuditLog()"/>
			</hbox>
			<description class="agent-muted">
				MCP clients can start <html:code>citewell mcp</html:code> with this data directory;
				it exposes the same verbs as tools over stdio. The CLI and the HTTP form above
				remain available for everything else.
			</description>
		</groupbox>

		<groupbox aria-label="What agents can do">
			<label><html:h2>What agents can do</html:h2></label>
			<description>
				In this build: <html:code>ping</html:code>, <html:code>search</html:code>,
				<html:code>item.get/create/update/addNote</html:code>,
				<html:code>item.attachFile/attachURL</html:code>,
				<html:code>translate.save</html:code> for DOI/ISBN/PMID/URL,
				<html:code>annotation.list/create</html:code> and
				<html:code>export.note</html:code> for Markdown,
				<html:code>collection.list/create/addItems</html:code>, and
				<html:code>ui.status/select/open/notify</html:code>.
			</description>
			<description class="agent-muted">
				The full verb list and protocol are in <html:code>docs/agent.md</html:code>.
			</description>
		</groupbox>

		<groupbox aria-label="Agent skill">
			<label><html:h2>Agent skill</html:h2></label>
			<description>
				Give an agent a ready-made <html:code>SKILL.md</html:code> that explains the app, the
				MCP tools and the safety rules. Save it as <html:code>citewell/SKILL.md</html:code>
				in the agent's skill directory.
			</description>
			<hbox>
				<button id="agent-skill-copy" label="Copy download link" oncommand="Zotero_Preferences.Agent.copySkillLink()"/>
				<button id="agent-skill-open" label="Open in browser" oncommand="Zotero_Preferences.Agent.openSkill()"/>
			</hbox>
			<description id="agent-skill-url" class="agent-path"/>
		</groupbox>

		<groupbox aria-label="Audit">
			<label><html:h2>Audit</html:h2></label>
			<description>
				Every agent call appends one line to <html:code id="agent-audit-path"/>, recording the
				method, object keys and outcome, not note text or field values.
			</description>
		</groupbox>
	</vbox>
