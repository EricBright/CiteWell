<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/overlay.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/overlay.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css"?>

<!--
	Item picker for the Browse tab (D47 Phase 2b). The web translator supplies an
	id -> title map through Zotero.selectItems(); this dialog returns the same map
	filtered to the checked rows, in window.arguments[0].result. It always sets a
	result: Save sets the map, Cancel/Esc/window-close set null.
-->
<window
	id="citewell-browse-item-selector"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	width="580" height="560"
	onload="load()">

	<script src="chrome://zotero/content/browseItemSelector.js"/>

	<vbox flex="1" style="padding: 12px;">
		<description id="intro"/>
		<hbox align="center" style="margin-top: 8px; margin-bottom: 8px;">
			<html:input id="pattern" type="text" style="flex: 1; margin-inline-end: 8px;"/>
			<button id="select-all" oncommand="setAll(true)"/>
			<button id="deselect-all" oncommand="setAll(false)"/>
		</hbox>
		<scrollbox id="scroll" flex="1"
			style="border: 1px solid var(--fill-quinary); border-radius: 4px; padding: 6px;">
			<vbox id="items"/>
		</scrollbox>
		<hbox align="center" style="margin-top: 10px;">
			<description id="count" flex="1"/>
			<button id="cancel" oncommand="cancel()"/>
			<button id="save" default="true" oncommand="ok()"/>
		</hbox>
	</vbox>
</window>
