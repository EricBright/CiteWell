<!--
	Google Docs gate (D47). Docs citations need Zotero's official connector inside
	Firefox; the in-app Browse tab cannot run extensions. window.arguments[0].result
	becomes "firefox", "continue" or null (cancel).
-->
<window
	id="citewell-docs-gate"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	width="520" height="300"
	onload="load()">

	<script src="chrome://zotero/content/browseDocsGate.js"/>

	<vbox flex="1" style="padding: 16px;">
		<description id="title" style="font-size: 1.2em; font-weight: bold; margin-bottom: 8px;"/>
		<description id="body" style="margin-bottom: 10px;"/>
		<description id="steps" style="margin-bottom: 10px; white-space: pre-line;"/>
		<html:input id="url" readonly="readonly"
			style="width: 100%; margin-bottom: 10px;" />
		<spacer flex="1"/>
		<hbox align="center">
			<html:a id="continue" href="#" style="font-size: 0.9em; opacity: 0.75;"/>
			<spacer flex="1"/>
			<button id="cancel" oncommand="cancel()"/>
			<button id="open-firefox" default="true" oncommand="openInFirefox()"/>
		</hbox>
	</vbox>
</window>
