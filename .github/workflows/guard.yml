name: Dependency guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the settings manifest
        run: cargo run --quiet --manifest-path tools/Cargo.toml -p xtask -- validate-settings

      - name: Validate the agent verb manifest
        run: cargo run --quiet --manifest-path tools/Cargo.toml -p xtask -- validate-agent

      - name: Check the file-plumbing ceiling
        run: cargo run --quiet --manifest-path tools/Cargo.toml -p xtask -- validate-plumbing

      - name: Check the loader and UI-SQL ceilings
        run: cargo run --quiet --manifest-path tools/Cargo.toml -p xtask -- validate-dependencies

      - name: Reject package, lockfile, and node_modules changes
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000)
                range="HEAD^..HEAD"
                ;;
              *)
                range="$before..${{ github.sha }}"
                ;;
            esac
          fi
          cargo run --quiet --manifest-path tools/Cargo.toml -p repo-guard -- --range "$range"
